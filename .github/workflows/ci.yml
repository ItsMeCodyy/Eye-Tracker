name: Test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libopengl0 libglib2.0-0
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check package compatibility
        run: python -m pip check
      - name: Compile application
        run: python -m compileall -q eye_tracker.py face_scan.py gaze_model.py screen_overlay.py
      - name: Run numerical, geometry, and application tests
        run: python -m unittest discover -s tests -v
