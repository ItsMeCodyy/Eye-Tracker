name: Test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libopengl0 libglib2.0-0
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check package compatibility
        shell: python
        run: |
          import platform
          import subprocess
          import sys
          import cv2, mediapipe, numpy, PySide6

          check = subprocess.run([sys.executable, '-m', 'pip', 'check'], capture_output=True, text=True)
          print(check.stdout, end='')
          print(check.stderr, end='', file=sys.stderr)
          # The published universal2 wheel has an incorrect Intel-only WHEEL tag.
          # https://github.com/google-ai-edge/mediapipe/issues/6112
          known_tag_defect = (
              sys.platform == 'darwin' and platform.machine() == 'arm64'
              and check.returncode == 1 and not check.stderr.strip()
              and check.stdout.strip() == 'mediapipe 0.10.21 is not supported on this platform'
          )
          if known_tag_defect:
              print('Known MediaPipe universal2 metadata defect; native runtime imports passed.')
          else:
              sys.exit(check.returncode)
      - name: Compile application
        run: python -m compileall -q eye_tracker.py face_scan.py gaze_model.py screen_overlay.py
      - name: Run numerical, geometry, and application tests
        run: python -m unittest discover -s tests -v
